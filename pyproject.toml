# Packaging for the infinimap backend.
#
# The distribution is the `infinimap` package under backend/: the collector, the
# read API, and the ibcore primitives they share. The frontend is built by npm
# and ships as static files the API serves.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infinimap"
dynamic = ["version"]          # read from infinimap.__version__, so it is stated once
description = "A live, time-aware map of an InfiniBand fabric"
readme = "README.md"
requires-python = ">=3.11"     # tomllib is stdlib from 3.11; dataclass slots from 3.10

# The base install is what both halves need: a database driver. That is enough
# to run `infinimap-collector` and `infinimap-db` on a fabric node.
dependencies = [
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
# Deliberately empty: the collector needs nothing beyond the base. It is named
# so the install line says what the machine is for, and so adding a dependency
# later does not change the documented command.
collector = []

# The read API and the UI it serves.
server = [
    "psycopg-pool>=3.2,<4",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
]

# httpx drives the app through TestClient rather than over a socket. It is here
# for the test suite, not for the runtime.
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
infinimap-api = "infinimap.api.__main__:console"
infinimap-collector = "infinimap.collector.__main__:console"
infinimap-db = "infinimap.db.__main__:console"

[tool.setuptools.dynamic]
version = { attr = "infinimap.__version__" }

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["infinimap*"]

[tool.setuptools.package-data]
# Loaded via Path(__file__).parent, so it must sit beside the module.
"infinimap.ibcore" = ["*.json"]
# web/** is the built frontend, placed here by CI before the wheel is built.
"infinimap.api" = ["*.example", "*.example.json", "web/**/*"]
"infinimap.collector" = ["*.example"]
# The schema ships with the package: an operator installing a wheel has no repo.
"infinimap.db" = ["migrations/*.sql"]
